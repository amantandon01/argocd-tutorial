apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.email: |
    host: smtp.gmail.com
    port: 587
    from: aman.tandon@tigeranalytics.com  
    username: $email-username
    password: $email-password

  template.app-sync-succeeded-email: |
    email:
      subject: "✅ ArgoCD: {{ .app.metadata.name }} Synced Successfully"
      body: |
        Application: {{ .app.metadata.name }}
        Sync Status: {{ .app.status.sync.status }}
        Health Status: {{ .app.status.health.status }}

  template.app-sync-failed-email: |
    email:
      subject: "❌ ArgoCD: {{ .app.metadata.name }} Sync FAILED"
      body: |
        Application: {{ .app.metadata.name }}
        Project: {{ .app.spec.project }}
        Please check the Argo CD dashboard to investigate the failure.

  trigger.on-sync-succeeded: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-sync-succeeded-email]
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed-email]